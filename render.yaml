# Alternativa de despliegue en la nube (no es el despliegue elegido).
# El despliegue oficial de esta entrega es local; ver docs/DESPLIEGUE.md.
#
# Para persistir datos en Render es necesario definir DATABASE_URL con un
# PostgreSQL externo (Neon, Supabase, Render PostgreSQL). Sin DATABASE_URL,
# PGlite usa un disco efímero y los datos se pierden al redeploy.
services:
  - type: web
    name: aquachile-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MAX_CV_BYTES
        value: "5242880"
